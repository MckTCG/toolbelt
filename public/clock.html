<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>TCG Lab · Match Clock (Web)</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111827;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:manipulation}body{display:flex;justify-content:center}.app{width:min(100%,620px);min-height:100dvh;display:flex;flex-direction:column;padding:12px;gap:10px}.top{background:#1f2937;border-radius:16px;padding:14px;text-align:center}.eyebrow{color:#cbd5e1;font-size:12px;letter-spacing:.12em;font-weight:800}.total{font-variant-numeric:tabular-nums;font-size:clamp(45px,12vw,68px);font-weight:850;line-height:1.05;margin:6px}.status{font-size:13px;color:#cbd5e1}.players{display:grid;grid-template-columns:1fr 1fr;flex:1;gap:10px;min-height:280px}.player{border:3px solid #3b4554;border-radius:18px;background:#263345;color:#fff;min-width:0;padding:15px 7px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}.player.active{background:#14532d;border-color:#4ade80}.player.expired{background:#7f1d1d;border-color:#f87171}.name{font-size:15px;font-weight:750}.time{font-size:clamp(27px,8vw,53px);font-variant-numeric:tabular-nums;font-weight:850;letter-spacing:-.05em}.hint{font-size:12px;color:#d1d5db;text-align:center}.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:9px}button{font-family:inherit}.control{border:0;border-radius:13px;padding:15px 6px;background:#475569;color:white;font-weight:750;font-size:14px}.control.primary{background:#2563eb}.foot{text-align:center;font-size:11px;color:#94a3b8;margin-bottom:2px}.player:focus-visible,.control:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
.back{font-size:12px;font-weight:750;color:#86efd3;text-decoration:none;padding:5px 1px;align-self:flex-start}.back:hover{text-decoration:underline}
</style></head><body><main class="app"><a class="back" href="./" aria-label="Back to Toolbelt">← Toolbelt</a><header class="top"><div class="eyebrow">REGULAR TIME · 30 MIN + 15 MIN OT</div><div class="total" id="total">30:00</div><div class="status" id="status" aria-live="polite">30:00 regular + 15:00 overtime · tap a player to start</div></header><div class="players"><button class="player" id="p0" aria-label="Player 1 turn"><span class="name">PLAYER 1</span><span class="time" id="t0">15:00</span><span class="hint" id="h0">TAP TO START</span></button><button class="player" id="p1" aria-label="Player 2 turn"><span class="name">PLAYER 2</span><span class="time" id="t1">15:00</span><span class="hint" id="h1">TAP TO START</span></button></div><div class="controls"><button class="control primary" id="pause">Pause</button><button class="control" id="undo">Undo tap</button><button class="control" id="reset">Reset</button></div><div class="foot">Tap the active player to pass · negative player time allowed · final alarm</div></main><script>
(()=>{const LIMIT=15*60*1000,REGULAR=30*60*1000,OT=15*60*1000,TOTAL=REGULAR+OT;let left=[LIMIT,LIMIT],total=TOTAL,active=-1,paused=false,last=performance.now(),history=[],finished=false,wakeLock=null,audioCtx=null,alarmSent=false;const $=id=>document.getElementById(id);const fmt=n=>{const negative=n<0;let s=Math.ceil(Math.abs(n)/1000);return `${negative?'-':''}${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};// Sound must be unlocked by a user gesture on mobile.
function unlockAudio(){try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(C)audioCtx=new C()}if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume().catch(()=>{})}catch(e){}}
function alarm(){if(alarmSent)return;alarmSent=true;try{if(navigator.vibrate)navigator.vibrate([350,180,350,180,600])}catch(e){}try{if(!audioCtx)return;const start=audioCtx.currentTime+.02;[0,.32,.64].forEach((offset)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),at=start+offset;osc.type="sine";osc.frequency.setValueAtTime(880,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.20,at+.02);gain.gain.exponentialRampToValueAtTime(.0001,at+.23);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(at);osc.stop(at+.24)})}catch(e){}}
async function keepAwake(){if(!("wakeLock" in navigator)||document.visibilityState!=="visible"||active<0||paused||finished||wakeLock)return;try{const lock=await navigator.wakeLock.request("screen");if(active<0||paused||finished){await lock.release();return}wakeLock=lock;lock.addEventListener("release",()=>{if(wakeLock===lock)wakeLock=null})}catch(e){}}
function releaseWake(){if(wakeLock){const old=wakeLock;wakeLock=null;old.release().catch(()=>{})}}
function advance(){const now=performance.now(),delta=Math.max(0,now-last);last=now;if(active>=0&&!paused&&!finished){total=Math.max(0,total-delta);left[active]-=delta;if(total<=0){finished=true;paused=true;alarm();releaseWake()}}}
function paint(){
 const overtime=total<=OT, phaseLeft=overtime?total:total-OT;
 $('total').textContent=fmt(phaseLeft);
 document.querySelector('.eyebrow').textContent=finished?'MATCH COMPLETE':overtime?'OVERTIME · FINAL 15 MIN':'REGULAR TIME · 30 MIN';
 left.forEach((v,i)=>{
  $('t'+i).textContent=fmt(v);
  $('p'+i).classList.toggle('active',active===i&&!paused&&!finished);
  $('p'+i).classList.toggle('expired',v<0);
  $('h'+i).textContent=finished?'MATCH ENDED':active===-1?'TAP TO START':active===i&&!paused?'TAP TO PASS':active===i?'PAUSED':'WAITING';
 });
 $('status').textContent=finished?'Global time expired · all clocks stopped':active<0?'30:00 regular + 15:00 overtime · tap a player to begin':paused?(overtime?'Overtime paused':'Regular time paused'):(overtime?'Overtime · ':'Regular · ')+'Player '+(active+1)+' clock running';
 $('pause').textContent=paused&&!finished?'Resume':'Pause';$('pause').disabled=active<0||finished;$('undo').disabled=!history.length||finished;
}
function clickPlayer(i){unlockAudio();advance();if(finished)return;if(active<0){active=i;paused=false}else if(paused){return}else if(active===i){history.push({left:[...left],total,active,paused,finished});if(history.length>30)history.shift();active=1-i}else{return}last=performance.now();keepAwake();paint()};$('p0').onclick=()=>clickPlayer(0);$('p1').onclick=()=>clickPlayer(1);$('pause').onclick=()=>{unlockAudio();advance();if(active<0||finished)return;paused=!paused;last=performance.now();if(paused)releaseWake();else keepAwake();paint()};$('undo').onclick=()=>{unlockAudio();advance();const x=history.pop();if(!x||finished)return;left=[...x.left];total=x.total;active=x.active;paused=x.paused;finished=x.finished;alarmSent=false;last=performance.now();if(!paused&&!finished)keepAwake();paint()};$('reset').onclick=()=>{if(active>=0&&!confirm('Reset player clocks to 15:00 and match to 30:00 + 15:00 OT?'))return;left=[LIMIT,LIMIT];total=TOTAL;active=-1;paused=false;finished=false;alarmSent=false;history=[];releaseWake();last=performance.now();paint()};setInterval(()=>{advance();paint()},100);document.addEventListener('visibilitychange',()=>{advance();if(document.visibilityState==='visible')keepAwake();paint()});paint();})();
</script></body></html>
