name: Verify Central TEMP Deployment Once
on:
  push:
    branches: [qa/temp-central-live-20261110]
    paths:
      - .github/workflows/temp-central-live-once.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm real Cloudflare files have deployed
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const root='https://mute-dust-0d50.forcoin99.workers.dev';
          let good=false;
          for(let i=0;i<18;i++){
            try{
              const [html,central,core,intake,deck,proxy]=await Promise.all([
                fetch(root+'/card-intake.html',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text()),
                fetch(root+'/data/temp-catalog-v1.json',{cache:'no-store',signal:AbortSignal.timeout(20000)}),
                fetch(root+'/temp-central-core.mjs',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text()),
                fetch(root+'/card-intake.mjs',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text()),
                fetch(root+'/deck-builder.mjs',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text()),
                fetch(root+'/proxy-import.mjs',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text())
              ]);
              const data=central.ok?await central.json():null;
              good=html.includes('id="acceptTemp"')&&html.includes('id="exportCentralTemp"')&&
                data?.schema==='tcg-lab-central-temp-v1'&&Array.isArray(data.cards)&&
                core.includes('parseCentralTemp')&&intake.includes('createTempProposal')&&
                deck.includes('mergeTempStores')&&proxy.includes('loadCentralTemp');
              console.log('Attempt',i+1,'central HTTP',central.status,'schema',data?.schema,'published TEMP cards',data?.cards?.length??'unknown','ready',good);
              if(good)break;
            }catch(error){console.log('Attempt',i+1,'error',error.message)}
            await new Promise(done=>setTimeout(done,8000));
          }
          assert(good,'Live Cloudflare central TEMP assets unavailable or incomplete');
          console.log('PASS: deployed Card Intake, shared TEMP JSON, Deck Builder and Proxy importer verified.');
          JS
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify JP-only draft acceptance in deployed browser
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1220,height:880}});
          const page=await context.newPage();
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          try {
            await page.goto('https://mute-dust-0d50.forcoin99.workers.dev/card-intake.html',{waitUntil:'domcontentloaded',timeout:40000});
            await page.waitForFunction(()=>document.querySelector('#catalogStatus')?.textContent.includes('gameplay records'),{timeout:35000});
            await page.waitForFunction(()=>document.querySelector('#centralTempStatus')?.textContent.includes('Central TEMP:'),{timeout:35000});
            const initial=await page.locator('#centralTempStatus').textContent();
            console.log('Central status:',initial);
            const candidate={source_url:'https://www.pokebeach.com/2026/11/production-jp-only-qa',
              discovery_id:'c'.repeat(22),name:'日本語テスト',set_name:'QA JP Set',
              card_number:'17',category:'Pokémon',stage:'Basic',language:'jp',
              image_url:'https://example.org/qa-jp-image.png',status:'provisional',
              source_verified:false,artwork_verified:false};
            await page.evaluate(c=>localStorage.setItem('tcg-lab-card-intake-v1',
              JSON.stringify({schema:'tcg-lab-card-intake-v1',cards:[c]})),candidate);
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('#centralTempStatus')?.textContent.includes('Central TEMP:'),{timeout:35000});
            await page.locator('.candidate').first().click();
            assert.equal(await page.locator('textarea[name=combined_text]').inputValue(),'');
            assert.equal(await page.locator('input[name=set_code]').inputValue(),'');
            await page.locator('#acceptTemp').click();
            await page.waitForFunction(()=>document.querySelector('#tempStatus').textContent.includes('TEMP draft saved locally'),{timeout:15000});
            assert((await page.locator('#tempStatus').textContent()).includes('Manual Simulator ready'));
            assert(await page.locator('#addTempDeck').isEnabled());
            assert(await page.locator('#openTempProxy').isEnabled());
            const local=JSON.parse(await page.evaluate(()=>localStorage.getItem('tcg-lab-card-db-v0.1')));
            assert(local.tempCards.some(x=>x.name==='日本語テスト'&&x.textEN===''));
            const downloadPromise=page.waitForEvent('download');
            await page.locator('#exportCentralTemp').click();
            const download=await downloadPromise;
            const fs=await import('node:fs/promises');
            const proposal=JSON.parse(await fs.readFile(await download.path(),'utf8'));
            assert.equal(proposal.schema,'tcg-lab-central-temp-proposal-v1');
            assert(proposal.cards.some(x=>x.name==='日本語テスト'));
            assert(!JSON.stringify(proposal).includes('"tags"'));
            console.log('PASS: deployed JP-only TEMP draft accepted without English and central proposal exported securely.');
            assert.deepEqual(errors,[]);
          } finally {await browser.close()}
          JS
