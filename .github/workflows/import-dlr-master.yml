name: Stage complete English DLR master import
on:
  push:
    branches: [main]
    paths:
      - scripts/import-dlr-master.mjs
      - .github/workflows/import-dlr-master.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/import-dlr-master.mjs
      - run: npm install --no-save cheerio@1.0.0
      - uses: actions/checkout@v4
        with:
          ref: feature/dlr-master-ready
          path: destination
          persist-credentials: true
      - name: Extract and stage full English DLR catalog
        run: node scripts/import-dlr-master.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-dlr-import-qa
          path: destination/docs/dlr-master-import-audit.json
      - name: Commit staged catalog and artwork to review branch only
        shell: bash
        run: |
          set -euo pipefail
          cd destination
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/card-db.html public/data/card-art-manifest.json public/assets/card-art/DLR docs/dlr-master-import-audit.json
          test -s docs/dlr-master-import-audit.json
          git diff --cached --quiet || (git commit -m "Import all 141 English Delta Reign printings" && git push origin HEAD:feature/dlr-master-ready)
