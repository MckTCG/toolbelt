name: Bootstrap Card Discovery Staging Once
on:
  push:
    branches: [automation/card-discovery-feed]
    paths:
      - .github/workflows/card-discovery-bootstrap.yml
permissions:
  contents: write
concurrency:
  group: card-discovery-staging
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract verified-source candidates into an unverified-only staging file
        run: |
          python3 scripts/discover-card-reveals.py \
            --max-articles 12 --max-proxies 50 \
            --prior public/data/card-discoveries-v1.json \
            --out /tmp/card-discoveries-v1.json
          node scripts/verify-card-discovery-feed.mjs /tmp/card-discoveries-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: card-discovery-bootstrap-preview
          path: /tmp/card-discoveries-v1.json
          retention-days: 7
      - name: Push only the unverified staging JSON to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TCG Lab Discovery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/data
          cp /tmp/card-discoveries-v1.json public/data/card-discoveries-v1.json
          git add -- public/data/card-discoveries-v1.json
          git commit -m "Bootstrap unverified Card Discovery feed"
          git push origin HEAD:refs/heads/automation/card-discovery-feed
