name: Stage Delta Reign artwork candidates
on:
  push:
    branches:
      - main
    paths:
      - scripts/stage-delta-reign-artwork.mjs
      - .github/workflows/stage-delta-reign-artwork.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staging script syntax
        run: node --check scripts/stage-delta-reign-artwork.mjs
      - name: Download and validate candidate images
        run: node scripts/stage-delta-reign-artwork.mjs
      - name: Archive candidates and report for manual printing verification
        uses: actions/upload-artifact@v4
        with:
          name: delta-reign-unverified-artwork
          path: artifacts/delta-reign-staging/
          retention-days: 14

      - name: Check out isolated candidate staging branch
        uses: actions/checkout@v4
        with:
          ref: staging/delta-reign-artwork-candidates
          path: candidate-repository
          persist-credentials: true
      - name: Save downloaded binaries and report on staging branch only
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/delta-reign-staging/staging-report.json
          rm -rf candidate-repository/artifacts/delta-reign-staging
          mkdir -p candidate-repository/artifacts/delta-reign-staging
          cp -R artifacts/delta-reign-staging/. candidate-repository/artifacts/delta-reign-staging/
          cd candidate-repository
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A artifacts/delta-reign-staging
          if git diff --cached --quiet; then
            echo 'Candidate art unchanged; nothing to commit.'
          else
            git commit -m "Stage unverified Delta Reign card artwork candidates"
            git push origin HEAD:staging/delta-reign-artwork-candidates
          fi
