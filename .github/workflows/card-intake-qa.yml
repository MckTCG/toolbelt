name: Master Card DB Intake v1 QA
on:
  push:
    branches: [feature/card-db-intake-v1, feature/card-intake-bulk-temp-20261110]
    paths:
      - public/card-intake*.mjs
      - public/card-intake.html
      - scripts/publish-card-intake.mjs
      - scripts/test-card-intake*.mjs
      - public/card-intake-loupe.mjs
      - public/temp-intake-core.mjs
      - public/temp-central-core.mjs
      - public/data/temp-catalog-v1.json
      - public/card-db.html
      - public/deck-builder.mjs
      - public/proxy-import.mjs
      - scripts/publish-central-temp.mjs
      - scripts/test-central-temp*.mjs
      - scripts/test-temp-intake*.mjs
      - .github/workflows/card-intake-qa.yml
  pull_request:
    paths:
      - public/card-intake*.mjs
      - public/card-intake.html
      - public/index.html
      - scripts/publish-card-intake.mjs
      - scripts/test-card-intake*.mjs
      - public/card-intake-loupe.mjs
      - public/temp-intake-core.mjs
      - public/temp-central-core.mjs
      - public/data/temp-catalog-v1.json
      - public/card-db.html
      - public/deck-builder.mjs
      - public/proxy-import.mjs
      - scripts/publish-central-temp.mjs
      - scripts/test-central-temp*.mjs
      - scripts/test-temp-intake*.mjs
      - .github/workflows/card-intake-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-and-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check public/card-intake-core.mjs && node --check public/card-intake.mjs && node --check public/card-intake-loupe.mjs && node --check public/temp-intake-core.mjs && node --check public/temp-central-core.mjs && node --check scripts/publish-central-temp.mjs && node --check scripts/publish-card-intake.mjs && node --check scripts/test-card-intake.mjs
      - run: node scripts/test-card-intake.mjs
      - run: node scripts/test-temp-intake.mjs
      - run: node scripts/test-temp-intake-bulk.mjs
      - run: node scripts/test-central-temp.mjs
      - run: node scripts/test-deck-builder.mjs
      - run: node scripts/test-tagger-master-access.mjs
  browser-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-card-intake-browser.mjs
      - run: node scripts/test-card-intake-loupe-browser.mjs
      - run: node scripts/test-temp-intake-browser.mjs
      - run: node scripts/test-temp-intake-bulk-browser.mjs
      - run: node scripts/test-central-temp-browser.mjs
      - name: Capture desktop and mobile loupe previews
        uses: actions/upload-artifact@v4
        with:
          name: card-intake-loupe-previews
          path: |
            /tmp/card-loupe-desktop.png
            /tmp/card-loupe-mobile.png
          retention-days: 7
