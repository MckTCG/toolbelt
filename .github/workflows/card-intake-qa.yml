name: Master Card DB Intake v1 QA
on:
  push:
    branches: [feature/card-db-intake-v1]
    paths:
      - public/card-intake*.mjs
      - public/card-intake.html
      - scripts/publish-card-intake.mjs
      - scripts/test-card-intake*.mjs
      - .github/workflows/card-intake-qa.yml
  pull_request:
    paths:
      - public/card-intake*.mjs
      - public/card-intake.html
      - public/index.html
      - scripts/publish-card-intake.mjs
      - scripts/test-card-intake*.mjs
      - .github/workflows/card-intake-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-and-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check public/card-intake-core.mjs && node --check public/card-intake.mjs && node --check scripts/publish-card-intake.mjs && node --check scripts/test-card-intake.mjs
      - run: node scripts/test-card-intake.mjs
      - run: node scripts/test-deck-builder.mjs
      - run: node scripts/test-tagger-master-access.mjs
  browser-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-card-intake-browser.mjs
