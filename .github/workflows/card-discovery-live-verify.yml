name: Verify Live Card Discovery Deployment
on:
  push:
    branches: [automation/card-discovery-feed]
    paths:
      - .github/workflows/card-discovery-live-verify.yml
permissions:
  contents: read
jobs:
  verify-worker-and-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe current deployed Worker and published staging feed
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://mute-dust-0d50.forcoin99.workers.dev';
          let latest='';
          for(let i=0;i<18;i++){
            const r=await fetch(origin+'/card-intake.html',{cache:'no-store',signal:AbortSignal.timeout(20000)});
            latest=await r.text();
            console.log('Worker attempt',i+1,r.status,r.url,'checkButton=',latest.includes('loadDiscoveries'));
            if(r.ok&&latest.includes('id="loadDiscoveries"'))break;
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert(latest.includes('id="loadDiscoveries"'),'Latest Card Intake deployment is not live');
          const js=await fetch(origin+'/card-intake.mjs',{cache:'no-store'}).then(r=>r.text());
          assert(js.includes('DISCOVERY_URL'),'Worker missing source-feed integration');
          const feed=await fetch('https://raw.githubusercontent.com/MckTCG/toolbelt/automation/card-discovery-feed/public/data/card-discoveries-v1.json',{cache:'no-store'}).then(r=>r.json());
          assert(feed.candidates.length>=20,'Staging feed has too few candidates');
          assert(feed.candidates.every(c=>!c.source_verified&&!c.artwork_verified),'Stage contains preverified records');
          console.log('PASS: Live Worker contains new button and JS, GitHub staging feed contains',feed.candidates.length,'unverified records.');
          NODE
      - name: Install browser test support
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Confirm live browser can import staged discoveries
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          try{
            await page.goto('https://mute-dust-0d50.forcoin99.workers.dev/card-intake.html',{waitUntil:'domcontentloaded',timeout:35000});
            await page.waitForFunction(()=>document.querySelector('#catalogStatus')?.textContent.includes('gameplay records'),{timeout:35000});
            await page.evaluate(()=>localStorage.setItem('tcg-lab-card-db-v0.1','KEEP_USER_TAGS'));
            await page.locator('#loadDiscoveries').click();
            await page.waitForFunction(()=>document.querySelector('#discoveryStatus')?.textContent.includes('newly staged'),{timeout:35000});
            const status=await page.locator('#discoveryStatus').textContent();
            const total=await page.locator('.candidate').count();
            console.log('Live UI status:',status,'cards visible=',total);
            assert(total>=20,'Live UI failed to load available provisional cards');
            assert.equal(await page.evaluate(()=>localStorage.getItem('tcg-lab-card-db-v0.1')),'KEEP_USER_TAGS');
            const raw=JSON.parse(await page.evaluate(()=>localStorage.getItem('tcg-lab-card-intake-v1')));
            assert(raw.cards.every(c=>!c.source_verified&&!c.artwork_verified&&c.status!=='approved'));
            await page.locator('#loadDiscoveries').click();
            await page.waitForFunction(()=>document.querySelector('#discoveryStatus')?.textContent.includes('0 newly staged'),{timeout:35000});
            assert.equal(await page.locator('.candidate').count(),total);
            assert.deepEqual(errors,[]);
            console.log('PASS: Real deployed browser fetched staging feed, preserved user tags, forced provisional, deduped second import.');
          }finally{await browser.close()}
          NODE
