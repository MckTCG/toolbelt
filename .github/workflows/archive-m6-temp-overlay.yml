name: Archive obsolete M6 browser overlays after English DLR import
on:
  push:
    branches: [main]
    paths:
      - scripts/archive-m6-temp-overlay.mjs
      - .github/workflows/archive-m6-temp-overlay.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: fix/archive-m6-temp-overlay
          path: destination
          persist-credentials: true
      - run: node --check scripts/archive-m6-temp-overlay.mjs
      - run: node scripts/archive-m6-temp-overlay.mjs
      - name: Commit changes on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          cd destination
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/card-db.html public/deck-builder.mjs
          git diff --cached --quiet || (git commit -m "Archive M6 TEMP cards from active browsing without deleting saved data" && git push origin HEAD:fix/archive-m6-temp-overlay)
