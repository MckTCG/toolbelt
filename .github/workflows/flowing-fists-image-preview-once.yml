name: Inspect Flowing Fists image thumbnails once
on:
  push:
    branches: [feature/flowing-fists-leak-intake-20261118]
    paths: [.github/workflows/flowing-fists-image-preview-once.yml]
permissions: {contents: read}
jobs:
  image-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q pillow
      - name: Preview source images as compressed diagnostic thumbnails
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          import io,base64,pathlib
          root=pathlib.Path('public/assets/flowing-fists-leaks/source-audit')
          for path in root.glob('*.jpg'):
            im=Image.open(path);im=ImageOps.exif_transpose(im);im.thumbnail((540,900))
            b=io.BytesIO();im.convert('RGB').save(b,format='JPEG',quality=45,optimize=True)
            print('BEGIN_CARD_IMAGE',path.name,base64.b64encode(b.getvalue()).decode('ascii'),flush=True)
          PY
