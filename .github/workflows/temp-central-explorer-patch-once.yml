name: One-Time Central TEMP Card Explorer Patch
on:
  push:
    branches: [feature/card-intake-temp-bridge-20261110]
    paths: [.github/workflows/temp-central-explorer-patch-once.yml]
permissions:
  contents: write
jobs:
  patch-card-explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/patch-card-db-central-once.mjs
      - run: |
          git diff --check
          git diff --stat
          git config user.name "TCG Lab QA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/card-db.html
          git commit -m "Read shared TEMP records in Card Explorer without editing personal storage"
          git push origin HEAD:refs/heads/feature/card-intake-temp-bridge-20261110
