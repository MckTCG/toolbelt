name: Build Flowing Fists proxy-ready crops (branch only)
on:
  push:
    branches: [feature/flowing-fists-leak-intake-20261118]
    paths: [.github/workflows/flowing-fists-proxy-build-once.yml]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - run: python -m pip install -q pillow
      - name: Generate real, individually cropped low-fidelity card artwork
        run: python scripts/build-flowing-fists-proxies.py
      - name: Check print assets are distinct and complete
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          from PIL import Image
          root=pathlib.Path('public/assets/flowing-fists-leaks')
          doc=json.loads((root/'manifest-v1.json').read_text())
          assert len(doc['cards'])==4
          assert len({x['sha256'] for x in doc['cards']})==4
          for x in doc['cards']:
            image=Image.open(root/x['file'])
            assert image.size==(744,1040)
            assert hashlib.sha256((root/x['file']).read_bytes()).hexdigest()==x['sha256']
            assert x['source_image_url'].startswith('https://')
            assert x['status'].startswith('unconfirmed')
            print('PASS PROXY',x['name'],x['number'],x['native_crop_dimensions'])
          PY
      - name: Commit assets only on approved development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/flowing-fists-leaks/cards public/assets/flowing-fists-leaks/manifest-v1.json
          if ! git diff --staged --quiet; then
            git commit -m 'Create four provisional Flowing Fists card proxy crops from real source photos'
            git push origin HEAD:refs/heads/feature/flowing-fists-leak-intake-20261118
          fi
