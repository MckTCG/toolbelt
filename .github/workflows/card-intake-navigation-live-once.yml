name: Verify Live Loupe Queue Navigation Once
on:
  push:
    branches: [qa/card-intake-navigation-live-20261110]
    paths: [.github/workflows/card-intake-navigation-live-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check deployed navigation source
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url='https://mute-dust-0d50.forcoin99.workers.dev';
          let ready=false;
          for(let n=1;n<=15;n++){
            const [markup,intake,loupe]=await Promise.all([
              fetch(url+'/card-intake.html',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text()),
              fetch(url+'/card-intake.mjs',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text()),
              fetch(url+'/card-intake-loupe.mjs',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text())
            ]);
            ready=markup.includes('id="cardLoupePrevious"')&&markup.includes('id="cardLoupeNext"')&&
                  markup.includes('id="cardLoupePosition"')&&
                  intake.includes('openLoupeFor')&&loupe.includes('function navigate(offset)');
            console.log('Worker deploy check',n,'navigation ready:',ready);
            if(ready)break;
            await new Promise(done=>setTimeout(done,8000));
          }
          assert(ready,'Merged navigation assets are not yet available from deployed Worker');
          console.log('PASS production HTTP: all navigation markup and modules deployed.');
          JS
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test real card reveal queue navigation in production
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          try{
            await page.goto('https://mute-dust-0d50.forcoin99.workers.dev/card-intake.html',{waitUntil:'domcontentloaded',timeout:35000});
            await page.waitForFunction(()=>document.querySelector('#catalogStatus')?.textContent.includes('gameplay records'),{timeout:30000});
            await page.evaluate(()=>localStorage.setItem('tcg-lab-card-db-v0.1','UNCHANGED_USER_TAGS'));
            await page.locator('#loadDiscoveries').click();
            await page.waitForFunction(()=>document.querySelector('#discoveryStatus')?.textContent.includes('newly staged'),{timeout:30000});
            const n=await page.locator('.candidate-loupe-trigger').count();
            assert(n>=40,'Insufficient live artwork candidates');
            const before=await page.evaluate(()=>localStorage.getItem('tcg-lab-card-intake-v1'));
            await page.locator('.candidate-loupe-trigger').first().click();
            assert(await page.locator('#cardLoupe').evaluate(x=>x.open));
            assert.equal(await page.locator('#cardLoupePosition').textContent(),'1 / '+n);
            assert(await page.locator('#cardLoupePrevious').isDisabled());
            const titleA=await page.locator('#cardLoupeTitle').textContent();
            await page.locator('#cardLoupeIn').click();
            assert.equal(await page.locator('#cardLoupeZoom').textContent(),'150%');
            await page.locator('#cardLoupeNext').click();
            assert.equal(await page.locator('#cardLoupePosition').textContent(),'2 / '+n);
            const titleB=await page.locator('#cardLoupeTitle').textContent();
            assert(titleA!==titleB,'Next did not change cards');
            assert.equal(await page.locator('#cardLoupeZoom').textContent(),'150%');
            await page.keyboard.press('ArrowLeft');
            assert.equal(await page.locator('#cardLoupeTitle').textContent(),titleA);
            await page.setViewportSize({width:390,height:844});
            await page.locator('#cardLoupeNext').click();
            assert.equal(await page.locator('#cardLoupeTitle').textContent(),titleB);
            const rect=await page.locator('#cardLoupe').boundingBox();
            assert(rect&&rect.width<=392&&rect.x>=-2,'Mobile dialog overflow');
            await page.keyboard.press('Escape');
            assert(!(await page.locator('#cardLoupe').evaluate(x=>x.open)));
            assert.equal(await page.evaluate(()=>localStorage.getItem('tcg-lab-card-intake-v1')),before);
            assert.equal(await page.evaluate(()=>localStorage.getItem('tcg-lab-card-db-v0.1')),'UNCHANGED_USER_TAGS');
            assert.deepEqual(errors,[],'Production browser errors: '+errors.join('; '));
            console.log('PASS production Chromium: navigated',n,'revealed cards by button and keyboard, kept zoom, worked mobile, preserved local data.');
          }finally{await browser.close()}
          JS
