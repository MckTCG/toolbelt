name: Build Flowing Fists Phase 2 provisional proxies (one time)
on:
  push:
    branches: [feature/flowing-fists-leaks-phase2-20261118]
    paths: [.github/workflows/flowing-fists-phase2-build-once.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - run: python -m pip install --quiet Pillow
      - name: Generate exact-art images and central TEMP entries
        run: python scripts/build-flowing-fists-phase2.py
      - name: Check cropping/provenance and catalogue uniqueness
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, hashlib
          root=Path('public/assets/flowing-fists-leaks')
          doc=json.loads((root/'manifest-v1.json').read_text())
          cat=json.loads(Path('public/data/temp-catalog-v1.json').read_text())
          images={x['file'] for x in doc['cards']}
          assert len(cat['cards'])==18,(len(cat['cards']),cat['cards'])
          assert len(doc['cards'])==18
          assert len(images)==18
          assert len({x['id'] for x in cat['cards']})==18
          assert len({x['number'] for x in cat['cards']})==18
          for row in doc['cards']:
            p=root/row['file']
            assert p.is_file()
            assert Image.open(p).size==(744,1040)
            assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
            assert (root/row['source_file']).is_file()
            print('PRINT IMAGE',row['name'],row['number'],row['native_crop_dimensions'],flush=True)
          print('PASS PHASE2: 18 verified-on-disk image crops, four original TEMP records preserved')
          PY
      - name: Commit assets and catalogue only to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/flowing-fists-leaks/cards/ public/assets/flowing-fists-leaks/manifest-v1.json public/data/temp-catalog-v1.json public/data/flowing-fists-leak-intake-20261118.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add fourteen provisional Flowing Fists photographic proxy printings'
            git push origin HEAD:refs/heads/feature/flowing-fists-leaks-phase2-20261118
          fi
