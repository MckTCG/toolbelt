name: Card Discovery Phase 2 QA
on:
  push:
    branches: [feature/card-db-discovery-phase2-20261110]
    paths:
      - scripts/discover-card-reveals.py
      - scripts/test-card-discovery.py
      - public/card-intake*.mjs
      - public/card-intake.html
      - .github/workflows/card-discovery-qa.yml
  pull_request:
    paths:
      - scripts/discover-card-reveals.py
      - scripts/test-card-discovery.py
      - public/card-intake*.mjs
      - public/card-intake.html
      - .github/workflows/card-discovery-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser-and-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 -m py_compile scripts/discover-card-reveals.py scripts/test-card-discovery.py
      - run: python3 scripts/test-card-discovery.py
      - run: node --check public/card-intake-core.mjs && node --check public/card-intake.mjs
      - run: node scripts/test-card-intake.mjs
      - run: node scripts/test-deck-builder.mjs
      - run: node scripts/test-tagger-master-access.mjs
  live-adapter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/discover-card-reveals.py --max-articles 5 --max-proxies 20 --card-url https://limitlesstcg.com/cards/en/DLR/84 --out /tmp/discovery-live.json
          python3 - <<'PY'
          import json
          obj=json.load(open('/tmp/discovery-live.json'))
          stats=obj['stats']
          print('LIVE DISCOVERY STATS:',stats)
          print('SOURCE ERRORS:',obj['errors'])
          assert obj['schema']=='tcg-lab-card-discovery-feed-v1'
          assert stats.get('pokebeach_cards',0)>=2,'Failed to extract two cards from structured news'
          assert stats.get('pokemonproxies_artworks',0)>=1,'Failed to extract provisional proxy artworks'
          assert len(obj['candidates'])>=2
          assert all(not x['source_verified'] and not x['artwork_verified'] and x['status']!='approved' for x in obj['candidates'])
          print('PASS: Live article/news/proxy extraction staged unverified records; no database writes.')
          PY
