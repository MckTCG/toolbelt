name: Flowing Fists Phase 2 source image audit (one time)
on:
  push:
    branches: [feature/flowing-fists-leaks-phase2-20261118]
    paths: [.github/workflows/flowing-fists-phase2-audit-once.yml]
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install --quiet Pillow requests beautifulsoup4
      - name: Fetch and inspect leaked source photographs
        run: python scripts/flowing-fists-phase2-harvest.py
      - name: Commit audited originals to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/flowing-fists-leaks/phase2-source
          if ! git diff --cached --quiet; then
            git commit -m 'Retain source photos for Flowing Fists Phase 2 with audit hashes'
            git push origin HEAD:refs/heads/feature/flowing-fists-leaks-phase2-20261118
          fi
