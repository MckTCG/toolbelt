name: Verify Flowing Fists Live (one-time)
on:
  push:
    branches: [qa/flowing-fists-live-20261118]
    paths: [.github/workflows/flowing-fists-live-once.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify live central TEMP and the four hosted image files
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const root='https://mute-dust-0d50.forcoin99.workers.dev/';
          const files=[
            'mega-lucario-z-ex-111.jpg',
            'mega-garchomp-z-ex-112.jpg',
            'blastoise-083.jpg',
            'ninetales-082.jpg'
          ];
          let done=false;
          for(let i=1;i<=18;i++){
            try{
              const r=await fetch(root+'data/temp-catalog-v1.json',{cache:'no-store',signal:AbortSignal.timeout(20000)});
              assert(r.ok);
              const catalog=await r.json();
              const ff=catalog.cards.filter(x=>x.setCode==='TMPFLO');
              if(ff.length!==4)throw Error('TEMP set not deployed yet: '+ff.length+' cards');
              const intake=await fetch(root+'card-intake.html',{cache:'no-store'});
              if(!(await intake.text()).includes('Load Flowing Fists leaks (8)'))throw Error('Intake not deployed');
              for(const file of files){
                const url=root+'assets/flowing-fists-leaks/cards/'+file;
                const result=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(20000)});
                assert(result.ok,'Missing image '+file+': HTTP '+result.status);
                assert((result.headers.get('content-type')||'').includes('image'),'Unexpected image MIME '+file);
                const bytes=await result.arrayBuffer();
                assert(bytes.byteLength>50000,'Unexpectedly small image '+file);
                console.log('PASS IMAGE '+file+' bytes='+bytes.byteLength);
              }
              console.log('PASS LIVE: 4 Flowing Fists TEMP cards, 8-card intake, 4 hosted images.');
              done=true;break;
            }catch(err){
              console.log('Deploy poll '+i+': '+err.message);
              if(i<18)await new Promise(ok=>setTimeout(ok,10000));
            }
          }
          assert(done,'Production deployment not verified in time');
          JS
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify production Proxy Workshop displays and prints TEMP cards
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1260,height:860}});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          try{
            await page.goto('https://mute-dust-0d50.forcoin99.workers.dev/proxy-workshop.html',{waitUntil:'domcontentloaded',timeout:45000});
            await page.locator('#openImporter').click();
            await page.waitForFunction(()=>document.querySelector('#proxyImportStatus')?.textContent.includes('ready'),{timeout:40000});
            await page.locator('#piSet').selectOption('TMPFLO');
            assert((await page.locator('#piResultCount').textContent()).includes('4 matching gameplay cards'));
            await page.locator('#piSearch').fill('Ninetales');
            const tile=page.locator('.pi-card').first();
            await tile.locator('img').first().evaluate(img=>new Promise((ok,fail)=>{
              if(img.complete&&img.naturalWidth)return ok();
              img.addEventListener('load',ok,{once:true});img.addEventListener('error',fail,{once:true});
            }));
            assert.equal(await tile.locator('img').first().evaluate(img=>img.naturalWidth),744);
            await tile.locator('[data-quick-qty="4"]').click();
            await page.waitForFunction(()=>document.querySelector('#proxyImportStatus')?.textContent.includes('Added 4'),{timeout:15000});
            await page.locator('#paperSize').selectOption('letter');
            const d=await page.evaluate(()=>window.__proxyDiagnostics());
            assert.equal(d.cards,4);assert.equal(d.pages,1);assert.equal(d.capacity,9);
            assert.deepEqual(errors,[]);
            console.log('PASS LIVE CHROMIUM: Ninetales 4 copies via central TEMP, Letter page, no script errors.');
          }finally{await browser.close()}
          JS
