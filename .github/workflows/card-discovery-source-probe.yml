name: Card Discovery Source Probe
on:
  push:
    branches: [feature/card-db-discovery-phase2-20261110]
    paths: [.github/workflows/card-discovery-source-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import urllib.request, re
          urls={
            'live-card-intake':'https://mute-dust-0d50.forcoin99.workers.dev/card-intake.html',
            'rss':'https://kaprestridge.github.io/pokebeach-news-feed/feed.xml',
            'pokemonproxies':'https://www.pokemonproxies.com/',
            'pokebeach':'https://www.pokebeach.com/2026/11/meowth-and-persian-revealed-from-aura-seeker',
            'limitless':'https://limitlesstcg.com/cards/en/DLR/84',
            'limitless-jp':'https://limitlesstcg.com/cards/jp/M6/58'
          }
          for label,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'TCGLabCardDiscovery/0.1 (personal-card-review; contact via GitHub MckTCG/toolbelt)','Accept':'text/html,application/xml,text/xml,*/*'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                body=resp.read(1_500_000).decode('utf-8','replace')
                print('SOURCE',label,'status',resp.status,'final',resp.url,'bytes',len(body),'type',resp.headers.get('content-type'))
                print('SNIPPET',re.sub(r'\s+',' ',body[:500])[:500])
                print('META',re.findall(r'<script[^>]*src=["\'][^"\']+',body[:10000])[:3])
                print('COUNTS', 'entry=',body.count('<entry'), 'item=',body.count('<item'), 'card=',body.count('DLR-'))
            except Exception as exc: print('SOURCE',label,'ERROR',type(exc).__name__,str(exc)[:220])
          PY
      - name: Inspect source-specific extractable structures
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request,xml.etree.ElementTree as ET
          H={'User-Agent':'TCGLabDiscovery/0.1 (research; MckTCG/toolbelt)'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=30) as r:return r.read().decode('utf8','replace')
          feed=ET.fromstring(get('https://kaprestridge.github.io/pokebeach-news-feed/feed.xml'))
          for item in feed.findall('./channel/item')[:3]:
            print('FEED',[(x.tag,(x.text or '')[:170]) for x in item if x.tag in ('title','link','pubDate','description')])
          html=get('https://limitlesstcg.com/cards/en/DLR/84')
          for term in ['Ruler&#039;s Roar','Ruler\'s Roar','Storm Emerald','card-page','card-text','data-card','card-name','card-detail','cardview','card-ability','main-content']:
            i=html.find(term)
            if i>=0:print('LIMITLESS-STRUCT',term,re.sub(r'\\s+',' ',html[max(0,i-420):i+850])[:1260])
          article=get('https://www.pokebeach.com/2026/11/meowth-and-persian-revealed-from-aura-seeker')
          for term in ['Meowth - 80','Persian - 100','articleBody','article__body','message-body','block--article','entry-content','p-body-content','bbWrapper']:
            i=article.find(term)
            if i>=0:print('ARTICLE-STRUCT',term,re.sub(r'\\s+',' ',article[max(0,i-550):i+1050])[:1550])
          app=get('https://www.pokemonproxies.com/')
          script=re.search(r'<script[^>]+src="(/assets/index-[^"]+\\.js)"',app)
          if script:
            asset=get('https://www.pokemonproxies.com'+script.group(1))
            print('PROXY-BUNDLE length',len(asset))
            for term in ['Flowing Fists','Pawmi','7a-023','Latest Proxies','Mega_Absol_Z']:
              i=asset.find(term)
              if i>=0:print('PROXY-STRUCT',term,asset[max(0,i-230):i+400].replace('\\n',' ')[:650])
          PY
