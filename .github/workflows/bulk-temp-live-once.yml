name: Verify Live Bulk TEMP Selection Once
on:
  push:
    branches: [qa/card-intake-bulk-live-20261110]
    paths: [.github/workflows/bulk-temp-live-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check deployed HTML and JS
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const root='https://mute-dust-0d50.forcoin99.workers.dev';
          let ready=false;
          for(let attempt=1;attempt<=15;attempt++){
            try{
              const [html,js,core]=await Promise.all([
                fetch(root+'/card-intake.html',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text()),
                fetch(root+'/card-intake.mjs',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text()),
                fetch(root+'/temp-intake-core.mjs',{cache:'no-store',signal:AbortSignal.timeout(20000)}).then(r=>r.text())
              ]);
              ready=html.includes('id="bulkSelectVisible"')&&html.includes('id="bulkAcceptTemp"')&&
                js.includes('planBulkTempAcceptance')&&core.includes('export function planBulkTempAcceptance');
              console.log('Deploy attempt',attempt,'bulk ready=',ready);
              if(ready)break;
            }catch(error){console.log('Deploy attempt',attempt,'error',error.message)}
            await new Promise(resolve=>setTimeout(resolve,8000));
          }
          assert(ready,'Cloudflare deployment did not yet expose bulk controls and code');
          console.log('PASS production HTTP: multi-select UI and processing modules live.');
          JS
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check real deployed queue with synthetic local records
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1200,height:840}});
          const page=await context.newPage();
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          const cards=[{source_url:'https://www.pokebeach.com/2026/11/bulk-live-test',
            discovery_id:'a'.repeat(22),name:'JP Test A',set_name:'QA JP Release',
            card_number:'21',category:'Pokémon',language:'jp',status:'provisional'},
            {source_url:'https://www.pokebeach.com/2026/11/bulk-live-test',
            discovery_id:'b'.repeat(22),name:'JP Test B',set_name:'QA JP Release',
            card_number:'22',category:'Pokémon',language:'jp',status:'provisional'}];
          try{
            await page.goto('https://mute-dust-0d50.forcoin99.workers.dev/card-intake.html',{waitUntil:'domcontentloaded',timeout:35000});
            await page.waitForFunction(()=>document.querySelector('#catalogStatus')?.textContent.includes('gameplay records'),{timeout:35000});
            await page.evaluate(cards=>localStorage.setItem('tcg-lab-card-intake-v1',JSON.stringify({
              schema:'tcg-lab-card-intake-v1',cards
            })),cards);
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('#catalogStatus')?.textContent.includes('gameplay records'),{timeout:35000});
            assert.equal(await page.locator('.candidate-bulk-check').count(),2);
            await page.locator('#bulkSelectVisible').click();
            assert.equal(await page.locator('.candidate-bulk-check:checked').count(),2);
            await page.locator('#bulkAcceptTemp').click();
            await page.waitForFunction(()=>document.querySelector('#bulkTempReport')?.textContent.includes('Accepted 2 TEMP draft(s)'),{timeout:15000});
            const storage=JSON.parse(await page.evaluate(()=>localStorage.getItem('tcg-lab-card-db-v0.1')));
            assert(storage.tempCards.some(c=>c.name==='JP Test A')&&storage.tempCards.some(c=>c.name==='JP Test B'));
            assert.equal(await page.locator('.candidate-bulk-check:checked').count(),0);
            assert.deepEqual(errors,[],'Browser JS errors: '+errors.join('; '));
            console.log('PASS production Chromium: selected two Japanese-only cards and accepted them together without English text.');
          }finally{await browser.close()}
          JS
